<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Drone & Bird Detection</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <header class="header">

        <div>
            <h1>Drone & Bird Detection</h1>
            <p>
                YOLO11 based object detection system
            </p>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Model Ready
        </div>

    </header>


    <main class="container">

        <section class="upload-card">

            <h2>Image Detection</h2>

            <p class="description">
                Upload an image containing a bird or drone
                and run object detection.
            </p>


            <label
                class="upload-box"
                for="imageInput"
            >

                <span class="upload-title">
                    Choose an image
                </span>

                <span class="upload-text">
                    JPG, JPEG or PNG
                </span>

            </label>


            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >


            <div
                id="fileInfo"
                class="file-info"
            ></div>


            <img
                id="previewImage"
                class="preview-image hidden"
                alt="Selected image preview"
            >


            <button
                id="detectButton"
                class="detect-button"
                disabled
            >
                Detect Objects
            </button>


            <p
                id="errorMessage"
                class="error-message"
            ></p>

        </section>


        <section
            id="resultSection"
            class="result-card hidden"
        >

            <div class="result-header">

                <div>
                    <h2>Detection Result</h2>
                    <p>YOLO11 prediction</p>
                </div>

                <div class="metrics">

                    <div class="metric">
                        <span id="detectionCount">0</span>
                        <small>Objects</small>
                    </div>

                    <div class="metric">
                        <span id="inferenceTime">0 ms</span>
                        <small>Inference</small>
                    </div>

                </div>

            </div>


            <img
                id="resultImage"
                class="result-image"
                alt="Detection result"
            >


            <div>
                <h3>Detections</h3>

                <div id="detectionsList"></div>
            </div>

        </section>

    </main>


    <script src="/static/app.js"></script>

</body>

</html>
